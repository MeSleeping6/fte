<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Okrut &amp; Karpenko Family Tree — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-title">The Okrut &amp; Karpenko Family Tree</div>
    <div class="brand-sub">EDITOR · Version 3</div>
  </div>
  <nav class="toolbar">
    <button class="tool active" id="selectMode">↖ <span>Select</span></button>
    <button class="tool" id="drawMode">╱ <span>Draw line</span></button>
    <i></i>
    <button class="tool" id="undo">↶ <span>Undo</span></button>
    <button class="tool" id="redo">↷ <span>Redo</span></button>
    <i></i>
    <button class="tool" id="minus">−</button>
    <button class="zoomText" id="zoomText">100%</button>
    <button class="tool" id="plus">+</button>
    <button class="tool" id="fit">Fit</button>
    <i></i>
    <button class="tool" id="newPerson">＋ Person</button>
    <button class="tool" id="minimapToggle">Map</button>
    <button class="tool" id="save">Save</button>
    <button class="tool" id="reset">Reset</button>
    <button class="tool" id="export">Export</button>
  </nav>
</header>

<main id="viewport">
  <svg id="tree" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3300 1360" preserveAspectRatio="xMinYMin meet">
    <g id="lineLayer"></g>
    <g id="personLayer"></g>
    <g id="draftLayer"></g>
  </svg>

  <aside id="editor" class="editor hidden"></aside>

  <div id="help" class="help">
    <b>Click a person</b> to edit · <b>drag empty space</b> to pan · <b>mouse wheel</b> to zoom
  </div>

  <div id="map" class="map">
    <div class="map-title">TREE MAP</div>
    <canvas id="mapCanvas" width="280" height="150"></canvas>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
